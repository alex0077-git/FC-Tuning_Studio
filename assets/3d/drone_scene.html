<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Betaflight Quad X</title>
  <style>
    html, body { margin: 0; height: 100%; background: #222222; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; }
    #err {
      position: absolute; left: 12px; bottom: 12px; color: #ff8888;
      font: 12px monospace; display: none; max-width: 90%; pointer-events: none;
    }
    #hint {
      position: absolute; right: 10px; bottom: 10px; color: #888;
      font: 11px sans-serif; pointer-events: none;
    }
  </style>
</head>
<body>
<div id="err"></div>
<div id="hint">1-finger orbit · 2-finger zoom/pan</div>
<script>
/**
 * Betaflight quad_x.gltf + orbit/zoom. Attitude rotates the craft; camera is free.
 */
(function () {
  var DEG2RAD = 0.017453292519943295;
  var errEl = document.getElementById('err');
  function showErr(msg) {
    if (!errEl) return;
    errEl.style.display = 'block';
    errEl.textContent = msg;
    console.error(msg);
  }

  if (typeof THREE === 'undefined') { showErr('THREE.js missing'); return; }
  if (typeof THREE.GLTFLoader === 'undefined') { showErr('GLTFLoader missing'); return; }
  if (typeof THREE.OrbitControls === 'undefined') { showErr('OrbitControls missing'); return; }

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);

  var camera = new THREE.PerspectiveCamera(60, 1, 1, 10000);
  camera.position.set(40, 50, 125);

  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x222222, 1);
  document.body.appendChild(renderer.domElement);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.enableZoom = true;
  controls.enablePan = true;
  controls.enableRotate = true;
  controls.rotateSpeed = 0.9;
  controls.zoomSpeed = 1.2;
  controls.panSpeed = 0.9;
  controls.screenSpacePanning = true;
  controls.minDistance = 30;
  controls.maxDistance = 500;
  controls.minPolarAngle = 0.05;
  controls.maxPolarAngle = Math.PI - 0.05;
  controls.mouseButtons = {
    LEFT: THREE.MOUSE.ROTATE,
    MIDDLE: THREE.MOUSE.DOLLY,
    RIGHT: THREE.MOUSE.PAN
  };
  controls.touches = {
    ONE: THREE.TOUCH.ROTATE,
    TWO: THREE.TOUCH.DOLLY_PAN
  };
  controls.target.set(0, 0, 0);
  controls.update();
  renderer.domElement.style.touchAction = 'none';

  var modelWrapper = new THREE.Object3D();
  scene.add(modelWrapper);

  scene.add(new THREE.AmbientLight(0x404040));
  var key = new THREE.DirectionalLight(new THREE.Color(1, 1, 1), 1.5);
  key.position.set(0, 1, 0);
  scene.add(key);
  scene.add(camera);

  var grid = new THREE.GridHelper(200, 20, 0x444444, 0x333333);
  scene.add(grid);

  var model = null;
  var target = { x: 0, y: 0, z: 0 };
  var current = { x: 0, y: 0, z: 0 };

  /** Front-right / rear-left = green; front-left / rear-right = red (diagonals). */
  function colorDiagonalProps(root) {
    root.updateMatrixWorld(true);
    root.traverse(function (obj) {
      if (!obj.isMesh || !obj.material || !obj.material.color) return;
      var c = obj.material.color;
      var isGreen = c.g > 0.85 && c.r < 0.25 && c.b < 0.25;
      var isRed = c.r > 0.85 && c.g < 0.25 && c.b < 0.25;
      if (!isGreen && !isRed) return;

      if (!obj.geometry.boundingBox) obj.geometry.computeBoundingBox();
      var center = new THREE.Vector3();
      obj.geometry.boundingBox.getCenter(center);
      obj.localToWorld(center);
      root.worldToLocal(center);

      // Same-sign x*z → one diagonal; opposite → other (BF nose −Z).
      var sameDiag = (center.x * center.z) >= 0;
      obj.material = obj.material.clone();
      if (sameDiag) {
        obj.material.color.setRGB(1, 0, 0);
      } else {
        obj.material.color.setRGB(0, 1, 0);
      }
    });
  }

  function onModel(root) {
    model = root;
    model.scale.set(15, 15, 15);
    colorDiagonalProps(model);
    modelWrapper.add(model);
    render();
  }

  function loadModel() {
    var loader = new THREE.GLTFLoader();
    var data = window.__BF_QUAD_GLTF__;
    if (data) {
      try {
        var text = typeof data === 'string' ? data : JSON.stringify(data);
        loader.parse(
          text,
          '',
          function (gltf) { onModel(gltf.scene); },
          function (e) { showErr('GLTF parse failed: ' + e); }
        );
        return;
      } catch (e) {
        showErr('GLTF inject failed: ' + e);
      }
    }
    showErr('No quad_x.gltf injected');
  }

  function resize() {
    var w = Math.max(window.innerWidth, 1);
    var h = Math.max(window.innerHeight, 1);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h, false);
    render();
  }
  window.addEventListener('resize', resize);
  resize();

  window.setAttitude = function (rollDeg, pitchDeg, yawDeg) {
    target.x = (pitchDeg || 0) * -1 * DEG2RAD;
    target.y = (yawDeg || 0) * -1 * DEG2RAD;
    target.z = (rollDeg || 0) * -1 * DEG2RAD;
  };

  window.resetCamera = function () {
    camera.position.set(40, 50, 125);
    controls.target.set(0, 0, 0);
    controls.update();
    render();
  };

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'attitude') window.setAttitude(d.roll, d.pitch, d.yaw);
    if (d.type === 'resetCamera') window.resetCamera();
  });

  function lerp(a, b, t) { return a + (b - a) * t; }

  function render() {
    if (model) {
      current.x = lerp(current.x, target.x, 0.28);
      current.y = lerp(current.y, target.y, 0.28);
      current.z = lerp(current.z, target.z, 0.28);
      model.rotation.x = current.x;
      modelWrapper.rotation.y = current.y;
      model.rotation.z = current.z;
    }
    controls.update();
    renderer.render(scene, camera);
  }

  function animate() {
    requestAnimationFrame(animate);
    render();
  }

  loadModel();
  animate();
})();
</script>
</body>
</html>
